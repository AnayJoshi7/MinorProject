<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Local Assets Fonts */
      @font-face {
        font-family: "AmericanCaptain";
        src: url("../assets/AmericanCaptain-MdEY.otf") format("opentype");
      }

      @font-face {
        font-family: "Avengero";
        src: url("../assets/AvengeroRegular-zvgl.ttf") format("truetype");
      }

      @font-face {
        font-family: "IronManOfWar2";
        src: url("../assets/IronManOfWar2Ncv-E85l.ttf") format("truetype");
      }

      .font-jarvis-logo {
        font-family: "Avengero", sans-serif;
        letter-spacing: 0.05em;
      }

      .font-jarvis-ui {
        font-family: "AmericanCaptain", sans-serif;
        letter-spacing: 0.08em;
      }

      .font-avengero {
        font-family: "Avengero", sans-serif;
      }

      /* Exact Background Gradient from design specs */
      .bg-ironman-screen {
        background: linear-gradient(
          125deg,
          #53141e 27%,
          #ab0a0a 59%,
          #801417 79%,
          #d39819 90%,
          #c0a345 100%
        );
      }

      /* Exact Input Bar Gradient from design specs */
      .bg-input-gradient {
        background: linear-gradient(
          to right,
          #712828 0%,
          #dfad30 19%,
          #f4c632 100%
        );
      }

      /* Arc Reactor Core Glow */
      .arc-glow {
        filter: drop-shadow(0 0 20px rgba(0, 180, 255, 0.45));
        animation: arc-reactor-float 4s ease-in-out infinite,
                   arc-reactor-glow 2.2s ease-in-out infinite;
        will-change: transform, filter;
      }

      @keyframes arc-reactor-float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes arc-reactor-glow {
        0%, 100% {
          filter: drop-shadow(0 0 16px rgba(0, 180, 255, 0.35));
        }
        50% {
          filter: drop-shadow(0 0 29px rgba(0, 190, 255, 0.72));
        }
      }

      /* Custom Chat Scrollbar */
      #chat::-webkit-scrollbar {
        width: 6px;
      }
      #chat::-webkit-scrollbar-track {
        background: transparent;
      }
      #chat::-webkit-scrollbar-thumb {
        background: rgba(223, 173, 48, 0.4);
        border-radius: 9999px;
      }
      #chat::-webkit-scrollbar-thumb:hover {
        background: rgba(223, 173, 48, 0.7);
      }

      @keyframes message-pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animate-message {
        animation: message-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 100%;
        justify-content: flex-end;
      }

      .message-row {
        display: flex;
        width: 100%;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.jarvis {
        justify-content: flex-start;
      }

      .chat-bubble {
        border-radius: 16px;
        box-shadow: 0 7px 14px rgba(31, 4, 7, 0.25);
        font-family: "AmericanCaptain", sans-serif;
        line-height: 1.05;
      }

      .user-bubble {
        width: fit-content;
        max-width: min(34vw, 390px);
        padding: 14px 18px 11px;
        background: #e7b530;
        color: #351010;
      }

      .jarvis-bubble {
        width: fit-content;
        max-width: min(52vw, 610px);
        padding: 15px 22px 12px;
        background: rgba(39, 8, 13, 0.88);
        border: 1px solid rgba(223, 173, 48, 0.52);
        color: #fff8e1;
      }

      .chat-text {
        margin: 0;
        font-size: clamp(16px, 1.45vw, 23px);
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .chat-time {
        display: block;
        margin-top: 7px;
        color: #6f4718;
        font-family: "AmericanCaptain", sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      .jarvis-bubble .chat-time {
        color: #c18c27;
      }

      .arc-reactor-image {
        transform: translateY(-18px);
      }

      .typing-bubble {
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 48px;
      }

      .typing-bubble span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #dfad30;
        animation: typing 1s infinite ease-in-out;
      }

      .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
      .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes typing {
        0%, 70%, 100% { transform: translateY(0); opacity: 0.45; }
        35% { transform: translateY(-5px); opacity: 1; }
      }

      @media (max-width: 700px) {
        .user-bubble,
        .jarvis-bubble {
          max-width: 82vw;
        }

        .chat-text {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden select-none bg-ironman-screen h-screen w-screen text-white font-jarvis-ui">
    <div class="relative h-full w-full flex flex-col justify-between overflow-hidden">
      
      <!-- Top Header Bar -->
      <header class="relative z-30 flex items-center justify-between px-8 pt-6">
        <h1 class="text-3xl text-[#dfad30] font-jarvis-logo tracking-wider drop-shadow-sm uppercase">
          JARVIS
        </h1>
        <div class="flex items-center gap-3">
          <span class="w-3.5 h-3.5 rounded-full bg-white shadow-[0_0_10px_#ffffff]"></span>
          <span class="text-2xl tracking-wider text-[#dfad30] font-avengero uppercase">
            ONLINE
          </span>
        </div>
      </header>

      <!-- Central Arc Reactor Stage (Slides way up when message is sent) -->
      <div
        id="heroStage"
        class="absolute inset-0 z-10 flex flex-col items-center justify-center transition-all duration-700 ease-in-out pointer-events-none"
      >
        <div id="arcReactor" class="relative transition-transform duration-700 arc-glow">
          <img
            src="../assets/arcreactor.png"
            alt="Arc Reactor"
            class="arc-reactor-image w-48 h-48 sm:w-56 sm:h-56 object-contain"
          />
        </div>

        <div id="heroText" class="mt-6 text-center transition-opacity duration-500">
          <p class="text-[#dfad30] text-2xl font-bold tracking-wider leading-none">
            HELLO, I AM JARVIS
          </p>
          <p class="text-[#dfad30] text-2xl font-bold tracking-wider leading-tight mt-1">
            WHAT CAN I DO FOR YOU TODAY?
          </p>
        </div>
      </div>

      <!-- Chat Bubble Container -->
      <main
        id="chat"
        class="relative z-20 flex-1 overflow-y-auto px-4 sm:px-12 pt-28 pb-32 space-y-4 max-w-6xl mx-auto w-full"
      >
        <div id="messages" class="space-y-4"></div>
      </main>

      <!-- Input Bar Section -->
      <footer class="relative z-30 w-full max-w-6xl mx-auto px-3 sm:px-4 pb-7">
        <div class="flex items-center gap-3">
          <!-- Text Input Field -->
          <div class="flex-1 relative min-h-16 rounded-xl bg-input-gradient p-[2px] shadow-lg shadow-black/40">
            <input
              id="input"
              type="text"
              placeholder="TYPE A MESSAGE"
              autocomplete="off"
              class="w-full bg-transparent px-5 py-4 text-xl font-jarvis-ui tracking-wider text-black placeholder-black focus:outline-none uppercase"
            />
          </div>

          <!-- Send Action Button (send.png) -->
          <button
            id="sendBtn"
            onclick="send()"
            title="Send Message"
            class="h-14 w-16 rounded-xl bg-[#dfad30] hover:bg-[#ebd55c] transition-all flex items-center justify-center shadow-lg active:scale-95"
          >
            <img
              src="../assets/send.png"
              alt="Send"
              class="w-6 h-6 object-contain"
            />
          </button>

          <!-- Stop / Cancel Action Button (stop.png) -->
          <button
            id="stopBtn"
            onclick="stopResponse()"
            title="Stop Response"
            class="h-14 w-16 rounded-xl bg-[#e63946] hover:bg-[#d62839] transition-all flex items-center justify-center shadow-lg active:scale-95"
          >
            <img
              src="../assets/stop.png"
              alt="Stop"
              class="w-6 h-6 object-contain"
            />
          </button>
        </div>
      </footer>
    </div>

    <script>
      let controller = null;
      let hasStarted = false;

      // Moves reactor upward and fades hero title
      function activateChatMode() {
        if (hasStarted) return;
        hasStarted = true;

        const stage = document.getElementById("heroStage");
        const arc = document.getElementById("arcReactor");
        const text = document.getElementById("heroText");

        text.style.opacity = "0";
        stage.classList.remove("justify-center");
        stage.classList.add("justify-start", "pt-3");
        arc.classList.add("scale-[0.42]", "-translate-y-8", "opacity-90");
      }

      function stopResponse() {
        if (controller) {
          controller.abort();
          controller = null;
        }
      }

      async function send(text = null) {
        const input = document.getElementById("input");
        const messages = document.getElementById("messages");
        const msg = (text || input.value).trim();
        if (!msg) return;

        activateChatMode();

        // User Chat Bubble
        const userDiv = document.createElement("div");
        userDiv.className = "message-row user animate-message";
        userDiv.innerHTML = `
          <div class="chat-bubble user-bubble">
            <p class="chat-text">${escapeHtml(msg)}</p>
            <span class="chat-time">${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
          </div>
        `;
        messages.appendChild(userDiv);
        input.value = "";
        scrollToBottom();

        // Typing Indicator Bubble
        const typingDiv = document.createElement("div");
        typingDiv.className = "message-row jarvis animate-message";
        typingDiv.id = "typing";
        typingDiv.innerHTML = `
          <div class="chat-bubble jarvis-bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        `;
        messages.appendChild(typingDiv);
        scrollToBottom();

        try {
          controller = new AbortController();
          const res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
            signal: controller.signal,
          });

          if (!res.ok) throw new Error(await res.text());

          typingDiv.remove();

          // Bot Chat Bubble
          const botDiv = document.createElement("div");
          botDiv.className = "message-row jarvis animate-message";
          botDiv.innerHTML = `
            <div class="chat-bubble jarvis-bubble">
              <p class="chat-text response-text"></p>
              <span class="chat-time">${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
            </div>
          `;
          messages.appendChild(botDiv);
          const botText = botDiv.querySelector(".response-text");

          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            botText.textContent += decoder.decode(value);
            scrollToBottom();
          }
        } catch (error) {
          const typing = document.getElementById("typing");
          if (typing) typing.remove();

          if (error.name === "AbortError") {
            const stopDiv = document.createElement("div");
            stopDiv.className = "message-row jarvis animate-message";
            stopDiv.innerHTML = `
              <div class="chat-bubble jarvis-bubble">
                <p class="chat-text">Operation Aborted</p>
              </div>
            `;
            messages.appendChild(stopDiv);
          }
        }
        scrollToBottom();
      }

      function scrollToBottom() {
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
      }

      function escapeHtml(value) {
        const container = document.createElement("div");
        container.textContent = value;
        return container.innerHTML;
      }

      document.getElementById("input").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") stopResponse();
      });
    </script>
  </body>
</html>
